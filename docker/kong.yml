# =============================================================================
# Kong Declarative Configuration for Supabase API Gateway
# Routes requests to GoTrue (auth) and PostgREST (rest) services.
# Les clés consommateur sont des marqueurs (ANON_KEY et SERVICE_ROLE_KEY entourés de doubles tirets bas) substitués
# au démarrage par l'entrypoint de supabase-kong (docker-compose.production.yml) : Kong
# n'interpole pas les variables d'environnement dans la config déclarative, et aucune clé
# de repli n'est admise.
# =============================================================================

_format_version: "2.1"
_transform: true

consumers:
  - username: ANON
    keyauth_credentials:
      - key: __ANON_KEY__
    acls:
      - group: anon
  - username: SERVICE_ROLE
    keyauth_credentials:
      - key: __SERVICE_ROLE_KEY__
    acls:
      - group: admin

services:
  # ── Auth (GoTrue) ──────────────────────────────────────────────────────────
  - name: auth-v1-open
    url: http://supabase-auth:9999/verify
    routes:
      - name: auth-v1-open
        strip_path: true
        paths:
          - /auth/v1/verify
    plugins:
      - name: cors

  - name: auth-v1-open-callback
    url: http://supabase-auth:9999/callback
    routes:
      - name: auth-v1-open-callback
        strip_path: true
        paths:
          - /auth/v1/callback
    plugins:
      - name: cors

  - name: auth-v1-open-authorize
    url: http://supabase-auth:9999/authorize
    routes:
      - name: auth-v1-open-authorize
        strip_path: true
        paths:
          - /auth/v1/authorize
    plugins:
      - name: cors

  - name: auth-v1
    url: http://supabase-auth:9999
    routes:
      - name: auth-v1
        strip_path: true
        paths:
          - /auth/v1/
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: false
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin
            - anon

  # ── PostgREST (REST API) ───────────────────────────────────────────────────
  - name: rest-v1
    url: http://supabase-rest:3000
    routes:
      - name: rest-v1
        strip_path: true
        paths:
          - /rest/v1/
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: false
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin
            - anon
