worker_processes auto;

events {
  worker_connections 1024;
}

http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  # Docker's embedded DNS is queried for each upstream resolution. This keeps
  # the relay aligned with the healthy Qalem web container across a rolling
  # replacement, rather than pinning a retired container IP.
  resolver 127.0.0.11 ipv6=off valid=5s;
  resolver_timeout 2s;

  server {
    listen 3000;
    server_name _;

    client_max_body_size 100m;

    location = /edge-health {
      access_log off;
      add_header Content-Type text/plain;
      return 200 "ok\n";
    }

    location / {
      # A variable makes nginx resolve the Docker alias at request time.
      set $qalem_upstream qalem-web:3000;
      proxy_pass http://$qalem_upstream;
      proxy_http_version 1.1;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      # Streaming generation must never be buffered by the relay.
      proxy_buffering off;
      proxy_connect_timeout 2s;
      proxy_read_timeout 75s;
      proxy_send_timeout 75s;

      # During a container handover, retry only transport failures before any
      # upstream response. This protects requests without replaying an HTTP
      # response that the application has already started to handle.
      proxy_next_upstream error timeout;
      proxy_next_upstream_tries 3;
      proxy_next_upstream_timeout 6s;
    }
  }
}
