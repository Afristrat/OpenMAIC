worker_processes auto;
# Exécution sans privilèges : aucun chemin hors /tmp n'est inscriptible.
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  # Docker's embedded DNS is queried for each upstream resolution. This keeps
  # the relay aligned with the healthy Qalem web container across a rolling
  # replacement, rather than pinning a retired container IP.
  resolver 127.0.0.11 ipv6=off valid=5s;
  resolver_timeout 2s;

  # Client address trust. Topology assumed (Coolify default, not declared in this
  # repository): internet -> Coolify Traefik -> this relay -> qalem-web, all on
  # private Docker networks. Traefik appends the peer it saw to X-Forwarded-For.
  # We only believe X-Forwarded-For entries added by private-range hops: with
  # recursive resolution, $remote_addr becomes the right-most address that is NOT
  # a trusted hop, so client-supplied entries on the left are never used.
  # If Cloudflare (or any public CDN) is added in front, this resolves to the CDN
  # edge address: add its published ranges to set_real_ip_from, or switch
  # real_ip_header to CF-Connecting-IP, only once that chain is established.
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  server {
    listen 3000;
    server_name _;

    client_max_body_size 100m;

    location = /edge-health {
      access_log off;
      add_header Content-Type text/plain;
      return 200 "ok\n";
    }

    location / {
      # A variable makes nginx resolve the Docker alias at request time.
      set $qalem_upstream qalem-web:3000;
      proxy_pass http://$qalem_upstream;
      proxy_http_version 1.1;

      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      # Overwrite, never append: the application must not see client-supplied
      # forwarding chains. $remote_addr is the realip-resolved client address.
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      # Streaming generation must never be buffered by the relay.
      proxy_buffering off;
      proxy_connect_timeout 2s;
      # The classroom-plan route has a five-minute application budget. Keep
      # the edge above that contract so it never replaces the API response
      # with an HTML 504 while the plan is still being prepared.
      proxy_read_timeout 310s;
      proxy_send_timeout 310s;

      # During a container handover, retry only transport failures before any
      # upstream response. This protects requests without replaying an HTTP
      # response that the application has already started to handle.
      proxy_next_upstream error timeout;
      proxy_next_upstream_tries 3;
      proxy_next_upstream_timeout 6s;
    }
  }
}
