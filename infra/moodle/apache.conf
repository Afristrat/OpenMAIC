# Four PHP requests maximum; the container's 2 GiB ceiling remains authoritative.
<IfModule mpm_prefork_module>
    StartServers 1
    MinSpareServers 1
    MaxSpareServers 2
    ServerLimit 4
    MaxRequestWorkers 4
    MaxConnectionsPerChild 200
</IfModule>
ServerName lms-test.qalem.ma
ServerTokens Prod
ServerSignature Off
Header always set X-Robots-Tag "noindex, nofollow, noarchive"
<Directory /var/www/html/.git>
    Require all denied
</Directory>
