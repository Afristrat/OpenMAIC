name: qalem-lti-moodle

services:
  db:
    image: postgres:16-alpine@sha256:16bc17c64a573ef34162af9298258d1aec548232985b33ed7b1eac33ba35c229
    environment:
      POSTGRES_DB: moodle
      POSTGRES_USER: moodle
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes:
      - database:/var/lib/postgresql/data
    networks: [database]
    command: [postgres, -c, shared_buffers=128MB, -c, max_connections=30]
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 0.5
    pids_limit: 128
    healthcheck:
      test: [CMD-SHELL, pg_isready -U moodle -d moodle]
      interval: 10s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }

  web:
    image: moodlehq/moodle-php-apache:8.3-bookworm@sha256:7fd5f3356a71889fc6eda2a7cca2b44ed1e3f90556f5c3bcd9f2091789739af2
    environment:
      APACHE_DOCUMENT_ROOT: /var/www/html
    depends_on:
      db: { condition: service_healthy }
    ports: ["127.0.0.1:8096:80"]
    secrets: [db_password]
    volumes:
      - /home/serveuria/qalem-lti-moodle/source:/var/www/html:ro
      - data:/var/www/moodledata
      - ./php.ini:/usr/local/etc/php/conf.d/zz-qalem.ini:ro
      - ./apache.conf:/etc/apache2/conf-enabled/zz-qalem.conf:ro
      - ./install.php:/opt/qalem/install.php:ro
      - ./init.sh:/docker-entrypoint.d/20-qalem.sh:ro
    networks: [database, outbound]
    restart: unless-stopped
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 1.5
    pids_limit: 128
    healthcheck:
      test: [CMD, curl, --fail, --silent, --output, /dev/null, "http://127.0.0.1/login/index.php"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }

secrets:
  db_password:
    file: /home/serveuria/qalem-lti-moodle/secrets/db_password

volumes:
  database:
  data:

networks:
  database:
    internal: true
  outbound:
