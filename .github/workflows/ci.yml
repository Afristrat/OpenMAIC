name: CI

on:
  push:
    branches: [main, develop, refork-v030]
  pull_request:
    branches: [main, refork-v030]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Verify S0-014 provenance
        run: pnpm check:provenance

      - name: Verify locale key parity
        run: pnpm check:i18n-keys

      - run: pnpm install --frozen-lockfile

      - name: Install media runtime
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y ffmpeg

      - name: Prettier
        run: pnpm check

      - name: ESLint
        run: pnpm lint

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Unit Tests
        run: pnpm test

      - name: Build
        run: pnpm build

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Build E2E app
        run: pnpm build
        env:
          NEXT_PUBLIC_MAIC_EDITOR_ENABLED: 'true'
          NEXT_PUBLIC_E2E_TEST_MODE: 'true'
          NEXT_PUBLIC_SUPABASE_URL: 'http://127.0.0.1:54321'
          NEXT_PUBLIC_SUPABASE_ANON_KEY: 'e2e-anon-key'
          SUPABASE_SERVICE_ROLE_KEY: 'e2e-service-role-key'

      - name: Run e2e tests
        run: pnpm exec playwright test
        env:
          E2E_PREBUILT: 'true'

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  migration-check:
    name: Supabase Migration Check
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local database
        run: supabase db start

      - name: Lint migrations
        run: supabase db lint --level warning
